---
apiVersion: v1
kind: Namespace
metadata:
  name: openchamber
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openchamber-storage
provisioner: microk8s.io/hostpath
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  pvDir: /var/lib/microk8s/storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openchamber-pvc
  namespace: openchamber
spec:
  storageClassName: openchamber-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: openchamber-secrets
  namespace: openchamber
type: Opaque
stringData:
  OPENCHAMBER_PASSWORD: CHANGEME
  GITHUB_TOKEN: CHANGEME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openchamber
  namespace: openchamber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openchamber
  template:
    metadata:
      labels:
        app: openchamber
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: openchamber
          image: localhost:32000/opencode:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: opencode
              containerPort: 4096
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: OPENCHAMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: OPENCHAMBER_PASSWORD
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: GITHUB_TOKEN
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: openchamber-data
              mountPath: /home/dev/.config/openchamber
              subPath: config-openchamber
            - name: openchamber-data
              mountPath: /etc/ssh/host-keys
              subPath: ssh-host-keys
            - name: opencode-share
              mountPath: /home/dev/.local/share/opencode
            - name: opencode-state
              mountPath: /home/dev/.local/state/opencode
            - name: opencode-config
              mountPath: /home/dev/.config/opencode
            - name: ssh
              mountPath: /home/dev/.ssh
              readOnly: true
            - name: openchamber-data
              mountPath: /home/dev/.ssh-state
              subPath: ssh-state
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: openchamber-data
          persistentVolumeClaim:
            claimName: openchamber-pvc
        - name: opencode-share
          hostPath:
            path: /home/stephen/.local/share/opencode
            type: DirectoryOrCreate
        - name: opencode-state
          hostPath:
            path: /home/stephen/.local/state/opencode
            type: DirectoryOrCreate
        - name: opencode-config
          hostPath:
            path: /home/stephen/.config/opencode
            type: DirectoryOrCreate
        # Mounted readOnly above: the dev user is UID 1000 == the host user, so a
        # writable mount would let anything in the container append to the host
        # account's authorized_keys.
        - name: ssh
          hostPath:
            path: /home/stephen/.ssh
            type: Directory
        - name: workspace
          hostPath:
            path: /home/stephen/openchamber
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: openchamber-service
  namespace: openchamber
spec:
  type: NodePort
  selector:
    app: openchamber
  ports:
    - protocol: TCP
      name: http
      port: 3000
      targetPort: 3000
    - protocol: TCP
      name: opencode
      port: 4096
      targetPort: 4096
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openchamber-ingress
  namespace: openchamber
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: openchamber.pythagoras.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openchamber-service
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode-ingress
  namespace: openchamber
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: opencode.pythagoras.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openchamber-service
                port:
                  number: 4096
# SSH (opencode.pythagoras.lan:2222) is reached directly via hostNetwork:
# the pod binds the host's :2222, so no Service or Ingress entry is needed
# for it. The Ingress above only handles HTTP/80 on the same hostname.
