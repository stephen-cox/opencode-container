# Example manifest for a single-node MicroK8s cluster. Placeholders to replace
# before applying:
#
#   USER          the node's local username, for the hostPath mounts below
#   example.lan   your own DNS suffix for the three Ingress hosts
#   CHANGEME      the Secret values
#
# The hostPath volumes assume a single node and are convenient for a local
# cluster; use PersistentVolumeClaims for anything scheduled across nodes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openchamber
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openchamber-storage
provisioner: microk8s.io/hostpath
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  pvDir: /var/lib/microk8s/storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openchamber-pvc
  namespace: openchamber
spec:
  storageClassName: openchamber-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: openchamber-secrets
  namespace: openchamber
type: Opaque
stringData:
  OPENCHAMBER_PASSWORD: CHANGEME
  # Basic-auth password for the ttyd web terminal. Omit the key (and the env
  # entry below) to reuse OPENCHAMBER_PASSWORD instead.
  WEB_TERMINAL_PASSWORD: CHANGEME
  GITHUB_TOKEN: CHANGEME
  # Optional: add CONTEXT7_API_KEY for higher Context7 rate limits.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chrome-devtools-mcp
  namespace: openchamber
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "mcp": {
        "chrome-devtools": {
          "type": "local",
          "command": [
            "chrome-devtools-mcp",
            "--browser-url=http://127.0.0.1:9222",
            "--no-usage-statistics",
            "--no-performance-crux",
            "--redact-network-headers"
          ],
          "enabled": true,
          "timeout": 15000
        },
        "context7": {
          "type": "remote",
          "url": "https://mcp.context7.com/mcp",
          "headers": {
            "Authorization": "Bearer {env:CONTEXT7_API_KEY}"
          },
          "enabled": true
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openchamber
  namespace: openchamber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openchamber
  template:
    metadata:
      labels:
        app: openchamber
    spec:
      containers:
        - name: openchamber
          # Published weekly by .github/workflows/publish.yml. With the
          # `latest` tag, imagePullPolicy: Always is what picks up each rebuild.
          # If the GHCR package is private, add an imagePullSecret with a
          # read:packages token instead of relying on anonymous pulls.
          image: ghcr.io/stephen-cox/opencode-container:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: opencode
              containerPort: 4096
              protocol: TCP
            - name: terminal
              containerPort: 7681
              protocol: TCP
          env:
            - name: OPENCHAMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: OPENCHAMBER_PASSWORD
            - name: WEB_TERMINAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: WEB_TERMINAL_PASSWORD
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: GITHUB_TOKEN
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: CONTEXT7_API_KEY
                  optional: true
            - name: OPENCODE_CONFIG
              value: /etc/opencode/chrome-devtools/opencode.json
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: openchamber-data
              mountPath: /home/dev/.config/openchamber
              subPath: config-openchamber
            - name: opencode-share
              mountPath: /home/dev/.local/share/opencode
            - name: opencode-state
              mountPath: /home/dev/.local/state/opencode
            - name: opencode-config
              mountPath: /home/dev/.config/opencode
            - name: ssh
              mountPath: /home/dev/.ssh
              readOnly: true
            - name: openchamber-data
              mountPath: /home/dev/.ssh-state
              subPath: ssh-state
            - name: workspace
              mountPath: /workspace
            - name: chrome-devtools-mcp
              mountPath: /etc/opencode/chrome-devtools
              readOnly: true
        - name: chrome
          image: ghcr.io/puppeteer/puppeteer:25.9.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              mkdir -p "${HOME}" /tmp/chrome-profile
              CHROME="$(node --input-type=module -e 'import puppeteer from "puppeteer"; process.stdout.write(await puppeteer.executablePath())')"
              exec "${CHROME}" \
                --headless \
                --no-sandbox \
                --remote-debugging-address=127.0.0.1 \
                --remote-debugging-port=9222 \
                --user-data-dir=/tmp/chrome-profile \
                --no-first-run \
                --no-default-browser-check \
                --disable-background-networking
          env:
            - name: HOME
              value: /tmp/chrome-home
            - name: PUPPETEER_CACHE_DIR
              value: /home/pptruser/.cache/puppeteer
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:9222/json/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:9222/json/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10042
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: chrome-tmp
              mountPath: /tmp
            - name: chrome-shm
              mountPath: /dev/shm
      volumes:
        - name: openchamber-data
          persistentVolumeClaim:
            claimName: openchamber-pvc
        - name: opencode-share
          hostPath:
            path: /home/USER/.local/share/opencode
            type: DirectoryOrCreate
        - name: opencode-state
          hostPath:
            path: /home/USER/.local/state/opencode
            type: DirectoryOrCreate
        - name: opencode-config
          hostPath:
            path: /home/USER/.config/opencode
            type: DirectoryOrCreate
        # Mounted readOnly above: the dev user is UID 1000 == the host user, so a
        # writable mount would let anything in the container append to the host
        # account's authorized_keys.
        - name: ssh
          hostPath:
            path: /home/USER/.ssh
            type: Directory
        - name: workspace
          hostPath:
            path: /home/USER/workspace
            type: Directory
        - name: chrome-devtools-mcp
          configMap:
            name: chrome-devtools-mcp
        - name: chrome-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: chrome-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openchamber-service
  namespace: openchamber
spec:
  type: NodePort
  selector:
    app: openchamber
  ports:
    - protocol: TCP
      name: http
      port: 3000
      targetPort: 3000
    - protocol: TCP
      name: opencode
      port: 4096
      targetPort: 4096
    - protocol: TCP
      name: terminal
      port: 7681
      targetPort: 7681
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openchamber-ingress
  namespace: openchamber
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: openchamber.example.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openchamber-service
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode-ingress
  namespace: openchamber
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: opencode.example.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openchamber-service
                port:
                  number: 4096
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terminal-ingress
  namespace: openchamber
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: terminal.example.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openchamber-service
                port:
                  number: 7681
# Shell access is the ttyd web terminal above; there is no sshd, so the pod no
# longer needs hostNetwork to bind a node port.
