name: Validate deployment

on:
  pull_request:
    paths:
      - Dockerfile
      - start.sh
      - compose.yaml
      - config/**
      - kubernetes.yaml
      - README.md
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start.sh
      - compose.yaml
      - config/**
      - kubernetes.yaml
      - README.md
      - .github/workflows/validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      OPENCHAMBER_PASSWORD: ci-openchamber-password
      GIT_USER_NAME: CI User
      GIT_USER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4

      - name: Create CI SSH key
        env:
          # The runner context is only valid in step-level env, not job-level.
          SSH_AUTHORIZED_KEYS_DIR: ${{ runner.temp }}/ci-ssh-keys
        run: |
          # Only authorized_keys goes in the mounted dir; the private key stays
          # outside the container.
          mkdir -p "${SSH_AUTHORIZED_KEYS_DIR}" ~/.ssh
          ssh-keygen -t ed25519 -f "${RUNNER_TEMP}/ci_key" -N ''
          cp "${RUNNER_TEMP}/ci_key.pub" "${SSH_AUTHORIZED_KEYS_DIR}/authorized_keys"
          echo "SSH_AUTHORIZED_KEYS_DIR=${SSH_AUTHORIZED_KEYS_DIR}" >> "${GITHUB_ENV}"
          echo "CI_SSH_KEY=${RUNNER_TEMP}/ci_key" >> "${GITHUB_ENV}"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the OpenCode image
        run: docker compose build opencode

      - name: Check packaged environment instructions as the default user
        run: |
          docker run --rm --entrypoint cat opencode-remote:chrome-mcp \
            /etc/opencode/environment.md | cmp config/environment.md -

      - name: Check the MCP executable
        run: >-
          docker run --rm --entrypoint chrome-devtools-mcp
          opencode-remote:chrome-mcp --help

      - name: Start OpenCode and Chrome
        run: docker compose up -d

      - name: Wait for container health
        run: |
          for attempt in $(seq 1 30); do
            opencode_id="$(docker compose ps -aq opencode)"
            chrome_id="$(docker compose ps -aq chrome)"
            if [ -z "${opencode_id}" ] || [ -z "${chrome_id}" ]; then
              echo "::error title=Container missing::opencode=${opencode_id:-missing} chrome=${chrome_id:-missing}"
              exit 1
            fi
            opencode_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${opencode_id}")"
            chrome_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${chrome_id}")"
            if [ "${opencode_status}" = healthy ] && [ "${chrome_status}" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps -a
          for service in opencode chrome; do
            container_id="$(docker compose ps -aq "${service}")"
            details="$(docker inspect --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_id}")"
            echo "::error title=${service} failed health check::${details}"
          done
          exit 1

      - name: Check Chrome from the OpenCode container
        run: >-
          docker compose exec -T opencode
          curl -fsS http://127.0.0.1:9222/json/version

      - name: Check MCP registration
        run: |
          docker compose exec -T opencode opencode mcp list | tee /tmp/opencode-mcp-list.txt
          grep -q chrome-devtools /tmp/opencode-mcp-list.txt
          grep -q context7 /tmp/opencode-mcp-list.txt

      - name: Check global Git identity
        run: |
          test "$(docker compose exec -T opencode git config --global --get user.name)" = "${GIT_USER_NAME}"
          test "$(docker compose exec -T opencode git config --global --get user.email)" = "${GIT_USER_EMAIL}"

      - name: Trust the container SSH host key
        run: |
          for attempt in $(seq 1 30); do
            if ssh-keyscan -p 2222 localhost 2>/dev/null >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::ssh-keyscan never reached sshd on localhost:2222" >&2
          exit 1

      - name: Check key-authenticated SSH login
        run: >-
          ssh -i "${CI_SSH_KEY}"
          -o StrictHostKeyChecking=yes -o BatchMode=yes
          -p 2222 dev@localhost 'echo ssh-login-ok'

      - name: Check mosh server is installed
        run: docker compose exec -T opencode mosh-server --version

      - name: Check interactive SSH attaches to tmux
        run: |
          # CI runners have TERM=dumb; tmux needs a real terminal type on the
          # remote pty, which ssh copies from the local environment.
          output="$(printf 'echo TMUX_ATTACH_OK && exit\n' | TERM=xterm ssh -tt -i "${CI_SSH_KEY}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -p 2222 dev@localhost || true)"
          echo "${output}"
          echo "${output}" | grep -q TMUX_ATTACH_OK

      - name: Check password authentication is refused
        run: |
          if ssh -o BatchMode=yes -o PubkeyAuthentication=no \
               -o StrictHostKeyChecking=yes -p 2222 dev@localhost true 2>/dev/null; then
            echo "::error::SSH authenticated without a public key" >&2
            exit 1
          fi

      - name: Check root login is refused
        run: |
          if ssh -i "${CI_SSH_KEY}" \
               -o StrictHostKeyChecking=yes -o BatchMode=yes \
               -p 2222 root@localhost true 2>/dev/null; then
            echo "::error::SSH root login succeeded" >&2
            exit 1
          fi

      - name: Check SSH host key survives a restart
        run: |
          # Recreate (not restart) so the ssh-host-keys named volume is the
          # only thing that could carry the host key across.
          docker compose up -d --force-recreate opencode
          for attempt in $(seq 1 30); do
            if ssh -i "${CI_SSH_KEY}" \
                 -o StrictHostKeyChecking=yes -o BatchMode=yes \
                 -p 2222 dev@localhost 'echo host-key-stable' 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SSH did not come back after recreate (host key may have changed)" >&2
          exit 1

      - name: Confirm DevTools is not published
        run: |
          published="$(docker compose port chrome 9222 2>/dev/null || true)"
          if [ -n "${published}" ]; then
            echo "Chrome DevTools port 9222 must not be published" >&2
            echo "${published}" >&2
            exit 1
          fi

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes schemas
        run: >-
          docker run --rm
          -v "${PWD}:/work:ro"
          ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary /work/kubernetes.yaml

      - name: Confirm DevTools is not exposed
        run: |
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -e 'select(.kind == "Service") | [.spec.ports[] | select(.port == 9222 or .targetPort == 9222)] | length == 0' \
            /work/kubernetes.yaml
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -e 'select(.kind == "Ingress") | [.. | select(. == 9222)] | length == 0' \
            /work/kubernetes.yaml

      - name: Validate embedded OpenCode configuration
        run: |
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -r 'select(.kind == "ConfigMap" and .metadata.name == "chrome-devtools-mcp") | .data."opencode.json"' \
            /work/kubernetes.yaml > /tmp/kubernetes-opencode.json
          node -e 'JSON.parse(require("fs").readFileSync("/tmp/kubernetes-opencode.json", "utf8"))'
          node -e 'const c=JSON.parse(require("fs").readFileSync("/tmp/kubernetes-opencode.json", "utf8")); if(c.mcp.context7?.url!=="https://mcp.context7.com/mcp") process.exit(1)'

      - name: Validate optional Context7 secret wiring
        run: >-
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2
          -e 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "openchamber") | [.env[] | select(.name == "CONTEXT7_API_KEY" and .valueFrom.secretKeyRef.optional == true)] | length == 1'
          /work/kubernetes.yaml

      - name: Validate Git identity wiring
        run: |
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -e 'select(.kind == "ConfigMap" and .metadata.name == "git-identity") | .data.GIT_USER_NAME == "CHANGEME" and .data.GIT_USER_EMAIL == "CHANGEME"' \
            /work/kubernetes.yaml
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -e 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "openchamber") | [.env[] | select((.name == "GIT_USER_NAME" or .name == "GIT_USER_EMAIL") and .valueFrom.configMapKeyRef.name == "git-identity")] | length == 2' \
            /work/kubernetes.yaml
