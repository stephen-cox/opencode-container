name: Validate deployment

on:
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - config/**
      - kubernetes.yaml
      - README.md
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - config/**
      - kubernetes.yaml
      - README.md
      - .github/workflows/validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      OPENCHAMBER_PASSWORD: ci-openchamber-password
      WEB_TERMINAL_PASSWORD: ci-terminal-password
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the OpenCode image
        run: docker compose build opencode

      - name: Check the MCP executable
        run: >-
          docker run --rm --entrypoint chrome-devtools-mcp
          opencode-remote:chrome-mcp --help

      - name: Start OpenCode and Chrome
        run: docker compose up -d

      - name: Inspect initial service state
        run: |
          for service in opencode chrome; do
            container_id="$(docker compose ps -aq "${service}")"
            if [ -z "${container_id}" ]; then
              echo "::error title=${service} container missing::Docker Compose did not create a container for ${service}"
              exit 1
            fi
            details="$(docker inspect --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_id}")"
            echo "::notice title=${service} initial state::${details}"
          done

      - name: Wait for container health
        run: |
          for attempt in $(seq 1 30); do
            opencode_id="$(docker compose ps -aq opencode)"
            chrome_id="$(docker compose ps -aq chrome)"
            if [ -z "${opencode_id}" ] || [ -z "${chrome_id}" ]; then
              echo "::error title=Container missing::opencode=${opencode_id:-missing} chrome=${chrome_id:-missing}"
              exit 1
            fi
            opencode_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${opencode_id}")"
            chrome_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${chrome_id}")"
            if [ "${opencode_status}" = healthy ] && [ "${chrome_status}" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps -a
          for service in opencode chrome; do
            container_id="$(docker compose ps -aq "${service}")"
            details="$(docker inspect --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_id}")"
            echo "::error title=${service} failed health check::${details}"
          done
          exit 1

      - name: Check Chrome from the OpenCode container
        run: >-
          docker compose exec -T opencode
          curl -fsS http://127.0.0.1:9222/json/version

      - name: Check MCP registration
        run: |
          docker compose exec -T opencode opencode mcp list | tee /tmp/opencode-mcp-list.txt
          grep -q chrome-devtools /tmp/opencode-mcp-list.txt

      - name: Confirm DevTools is not published
        run: |
          published="$(docker compose port chrome 9222 2>/dev/null || true)"
          if [ -n "${published}" ]; then
            echo "Chrome DevTools port 9222 must not be published" >&2
            echo "${published}" >&2
            exit 1
          fi

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes schemas
        run: >-
          docker run --rm
          -v "${PWD}:/work:ro"
          ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary /work/kubernetes.yaml

      - name: Confirm DevTools is not exposed
        run: |
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -e 'select(.kind == "Service") | [.spec.ports[] | select(.port == 9222 or .targetPort == 9222)] | length == 0' \
            /work/kubernetes.yaml
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -e 'select(.kind == "Ingress") | [.. | select(. == 9222)] | length == 0' \
            /work/kubernetes.yaml

      - name: Validate embedded OpenCode configuration
        run: |
          docker run --rm -v "${PWD}:/work:ro" mikefarah/yq:4.47.2 \
            -r 'select(.kind == "ConfigMap" and .metadata.name == "chrome-devtools-mcp") | .data."opencode.json"' \
            /work/kubernetes.yaml > /tmp/kubernetes-opencode.json
          node -e 'JSON.parse(require("fs").readFileSync("/tmp/kubernetes-opencode.json", "utf8"))'
